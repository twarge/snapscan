name: App Store

# Archives and uploads the app to App Store Connect (TestFlight / review).
# Run it manually from the Actions tab, or push a version tag like v1.2.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     Contents of the AuthKey_<KEYID>.p8 file
# Create the key at App Store Connect → Users and Access → Integrations →
# App Store Connect API, with the App Manager role (needed for cloud signing).
#
# Signing is fully cloud-managed: xcodebuild uses the API key to create and
# fetch distribution certificates and profiles, and
# manageAppVersionAndBuildNumber lets it bump CFBundleVersion past whatever
# App Store Connect already has, so uploads never collide.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to build (defaults to the project's MARKETING_VERSION)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One platform at a time: parallel legs share the ASC key and race
      # Apple's provisioning and upload services, which intermittently fails
      # the slower leg with misleading errors ("Cloud signing permission
      # error", "Account credentials have expired").
      max-parallel: 1
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
            archive: build/SnapScan-macOS.xcarchive
            asc_platform: MAC_OS
    steps:
      - uses: actions/checkout@v5

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          # Shape checks only — never prints secret values.
          [ "${#ASC_KEY_ID}" -eq 10 ] || { echo "::error::ASC_KEY_ID length is ${#ASC_KEY_ID}, expected 10"; exit 1; }
          [ "${#ASC_ISSUER_ID}" -eq 36 ] || { echo "::error::ASC_ISSUER_ID length is ${#ASC_ISSUER_ID}, expected a 36-char UUID"; exit 1; }
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 || { echo "::error::ASC_KEY_P8 does not look like a raw .p8 (missing BEGIN PRIVATE KEY — paste the file contents, not base64)"; exit 1; }

      - name: Determine marketing version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(sed -n 's/.*MARKETING_VERSION = \([0-9.][0-9.]*\);.*/\1/p' SnapScan.xcodeproj/project.pbxproj | head -1)
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Resolved version '$VERSION' is not a plain version number (tag like v1.2)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building marketing version $VERSION"

      # Fails fast with a readable message when App Store Connect would reject
      # the upload because this version's train is already approved and closed.
      - name: Check the version train is open
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_BUNDLE_ID: com.twinleaf.snapscan
          ASC_PLATFORM: ${{ matrix.asc_platform }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASC_KEY_PATH=~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            swift scripts/check-appstore-version.swift

      - name: Build vendored SANE + xcframework
        run: |
          pkg-config --version || brew install pkg-config
          scripts/build-sane.sh
          scripts/make-xcframework.sh

      - name: Write export options
        run: |
          cat > build-exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project SnapScan.xcodeproj \
            -scheme SnapScan \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -archivePath '${{ matrix.archive }}' \
            MARKETING_VERSION='${{ steps.version.outputs.version }}' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath '${{ matrix.archive }}' \
            -exportOptionsPlist build-exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
