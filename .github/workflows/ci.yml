name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Needs Xcode 26+ (Swift 6.2: main-actor default isolation).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # Ad-hoc signing (not CODE_SIGNING_ALLOWED=NO): the test host must
      # carry its sandbox entitlements, and the artifact stays launchable.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SnapScan.xcodeproj \
            -scheme SnapScan \
            -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tail -40

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SnapScan.xcodeproj \
            -scheme SnapScan \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tail -60

      - name: Package build artifact
        run: |
          PRODUCTS="$(xcodebuild -project SnapScan.xcodeproj -scheme SnapScan \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR =/{print $3}')"
          ditto -c -k --keepParent "$PRODUCTS/SnapScan.app" SnapScan-ci.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SnapScan-ci
          path: SnapScan-ci.zip
