name: Release

# Developer ID signed, notarized, stapled app on a GitHub Release. Run it
# manually from the Actions tab, or push a version tag like v1.2.
#
# NOT the App Store: bundled sane-backends is GPL (third-party copyright),
# and App Store terms conflict with the GPL — Developer ID + notarization
# is the standard channel for GPL Mac apps.
#
# Required repository secrets (same trio drives signing and notarization):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     Contents of the AuthKey_<KEYID>.p8 file
# Create the key at App Store Connect → Users and Access → Integrations →
# App Store Connect API, with the App Manager role (needed for cloud
# signing). A "Developer ID Application" certificate must exist for the
# team (create once in Xcode → Settings → Accounts if cloud signing can't).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

      - name: Build vendored SANE + xcframework
        run: |
          pkg-config --version || brew install pkg-config
          scripts/build-sane.sh
          scripts/make-xcframework.sh

      - name: Write export options
        run: |
          cat > build-exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>257KW9ZJFP</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Sign the archive with the Developer ID identity directly — the default signs
          # archives with Apple Development, minting a fresh certificate on every
          # ephemeral runner until the account hits Apple's certificate cap.
          xcodebuild archive \
            -project SnapScan.xcodeproj \
            -scheme SnapScan \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/SnapScan.xcarchive \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export (Developer ID)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SnapScan.xcarchive \
            -exportOptionsPlist build-exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent build/export/SnapScan.app SnapScan-notarize.zip
          xcrun notarytool submit SnapScan-notarize.zip \
            --key ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple build/export/SnapScan.app
          rm SnapScan-notarize.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="manual-$(date +%Y%m%d-%H%M)"
          fi
          ditto -c -k --keepParent build/export/SnapScan.app "SnapScan-$VERSION.zip"
          gh release create "$VERSION" \
            --title "SnapScan $VERSION" \
            --generate-notes \
            "SnapScan-$VERSION.zip"
